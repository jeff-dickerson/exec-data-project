# Basic CI Workflow

name: Python CI

on:
  push:
    branches: [ "main", "develop" ] # Adjust branches as needed
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Specify desired Python version

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Ingestion Script Dry Run (Check Syntax/Imports)
      # This won't actually fetch data as API key is not set in CI
      # But it checks if the script runs without basic errors
      env:
        EIA_API_KEY: "DUMMY_KEY_FOR_CI" # Provide a dummy key to pass the initial check
      run: |
        python ingestion/fetch_crude_production.py 